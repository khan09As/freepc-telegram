name: Free Linux Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest

    steps:
      - name: Install Desktop
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-terminal \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            chromium

      - name: Start Linux Desktop
        run: |
          export DISPLAY=:99

          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3

          dbus-run-session -- startxfce4 &
          sleep 10

          x11vnc \
            -display :99 \
            -forever \
            -shared \
            -nopw \
            -rfbport 5900 \
            -listen 127.0.0.1 &

          sleep 3

          websockify \
            --web=/usr/share/novnc/ \
            6080 \
            127.0.0.1:5900 &

          sleep 5

          chromium \
            --no-sandbox \
            --disable-dev-shm-usage \
            --start-maximized \
            https://chatgpt.com &

      - name: Install Cloudflare Tunnel
        run: |
          curl -L \
            -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

      - name: Create Desktop Link
        run: |
          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate 2>&1 | tee tunnel.log &

          sleep 10

          echo "======================================"
          echo "FREE LINUX DESKTOP URL"
          echo "======================================"

          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' tunnel.log || true

          echo "======================================"

          sleep 21600
