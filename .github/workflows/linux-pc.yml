name: Free Linux PC

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: System information
        run: |
          echo "===== FREEPC ====="
          uname -a
          echo "CPU:"
          nproc
          echo "RAM:"
          free -h

      - name: Install desktop and browser
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-terminal \
            chromium-browser \
            xvfb \
            x11vnc

      - name: Test GUI
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          chromium-browser \
            --no-sandbox \
            --disable-dev-shm-usage \
            https://chatgpt.com &
          sleep 15
          echo "Chrome/ChatGPT test completed."
